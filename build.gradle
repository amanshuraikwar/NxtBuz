import io.github.amanshuraikwar.nxtbuz.buildSrc.Libs
import org.gradle.api.attributes.Attribute

buildscript {
    ext.names = [
            'applicationId': "io.github.amanshuraikwar.nxtbuz"
    ]

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath Libs.androidGradlePlugin

        classpath Libs.Kotlin.gradlePlugin

        classpath Libs.Google.gmsGoogleServices
        classpath Libs.Google.crashlyticsGradle

        classpath Libs.Google.gmsOssLicenses

        classpath Libs.SqlDelight.gradlePlugin

        classpath Libs.KotlinX.serializationGradlePlugin
    }
}

allprojects {
    def podFrameworkAttribute = Attribute.of("com.github.amanshuraikwar.kmm.podFrameworkType", String)

    configurations.configureEach { configuration ->
        if (configuration.name in ["podDebugFrameworkIos", "podReleaseFrameworkIos"]) {
            configuration.attributes.attribute(
                    podFrameworkAttribute,
                    (configuration.name + "Ios").toString()
            )
        } else if (configuration.name in ["podDebugFrameworkIosFat", "podReleaseFrameworkIosFat"]) {
            configuration.attributes.attribute(
                    podFrameworkAttribute,
                    (configuration.name + "IosFat").toString()
            )
        }
    }

    configurations.all {
        resolutionStrategy {
            force("com.google.guava:listenablefuture:9999.0-empty-to-avoid-conflict-with-guava")
        }
    }
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
